name: Bootstrap release lock (temporary)

on:
  push:
    branches: [release/alpha-prep-v0.1.0]
    paths: [.github/workflows/bootstrap-lock.yml]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'chinn-choppa/synplify-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install fixed uv
        run: python -m pip install uv==0.13.0
      - name: Resolve universal dependency lockfile
        run: uv lock --python 3.13
      - name: Commit only the lockfile on the isolated release branch
        run: |
          set -euo pipefail
          test -s uv.lock
          git add -- uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]'                 -c user.email='41898282+github-actions[bot]@users.noreply.github.com'                 commit -m 'build(release): generate uv.lock with uv 0.13.0'
            git push origin HEAD:refs/heads/release/alpha-prep-v0.1.0
          fi
